[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfc"
version = "1.1.1"
description = "PCD closed-loop feedback control for RIGOL DHO814 + DG2052"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyvisa>=1.14",
  "pyvisa-py>=0.7",
  "pyusb>=1.2",
  "numpy>=1.24",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.6"]

[project.scripts]
pfc = "pfc.gui.app:main"
pfc-cli = "pfc.cli:main"

[tool.setuptools.packages.find]
include = ["pfc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
